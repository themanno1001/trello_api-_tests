# This is a basic workflow to help you get started with Actions

name: Trello API Tests

# Controls when the workflow will run
on:
  # Triggers the workflow on push 
  push:
  

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
 
  run-postman-tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

   
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

  
      - name: Install Newman
        run: npm install -g newman
       
      - name: Run Rollection
       env:
         POSTMAN_AI_KEY:  ${{ secrets.Postman_AI_KEY }}
         POSTMAN_Token:  ${{ secrets.Postman_TOKEN }}
        run:  newman run Trello_collection.json -e Trelllo_Prod_environment.json --env-var "api_key=${Postman_AI_KEY}" --env-var "token=${Postman_TOKEN}"
      
